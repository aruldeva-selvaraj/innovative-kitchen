<style>
  /* ── CONFIG ── change only here ── */
  :root {
    --phone:    "+971 56 724 0634";
    --wa-link:  "https://wa.me/971567240634?text=Hi%2C%20I%27d%20like%20a%20kitchen%20equipment%20quote";
    --site:     "innovativekitchen.ae";
    --primary:  #E63946;
    --dark:     #C1121F;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:300px; height:250px; overflow:hidden; font-family:'Segoe UI',Arial,sans-serif; }

  .ad { width:300px; height:250px; background:#1a1a2e; position:relative; overflow:hidden; cursor:pointer; }

  /* Animated gradient background */
  .bg-grad {
    position:absolute; inset:0;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    animation: bgPulse 4s ease-in-out infinite alternate;
  }
  @keyframes bgPulse {
    from { opacity:1; } to { opacity:0.85; }
  }

  /* Red accent bar top */
  .accent-bar {
    position:absolute; top:0; left:0; right:0; height:4px;
    background: linear-gradient(90deg, var(--primary), var(--dark), var(--primary));
    background-size:200% 100%;
    animation: shimmer 2s linear infinite;
  }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* Floating kitchen icon bg */
  .bg-icon {
    position:absolute; right:-20px; bottom:-20px;
    font-size:120px; opacity:0.06; line-height:1;
    animation: float 3s ease-in-out infinite alternate;
  }
  @keyframes float { from{transform:translateY(0) rotate(-10deg)} to{transform:translateY(-10px) rotate(5deg)} }

  /* Brand badge */
  .brand {
    position:absolute; top:16px; left:16px; right:16px;
    display:flex; align-items:center; gap:8px;
    animation: fadeDown 0.5s ease forwards;
  }
  .brand-dot { width:8px; height:8px; background:var(--primary); border-radius:50%; flex-shrink:0; }
  .brand-name { color:white; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.9; }

  /* Main headline */
  .headline {
    position:absolute; top:48px; left:16px; right:16px;
    color:white; font-size:19px; font-weight:800; line-height:1.25;
    animation: fadeUp 0.6s 0.2s ease both;
  }
  .headline span { color:var(--primary); }

  /* Sub text */
  .sub {
    position:absolute; top:108px; left:16px; right:16px;
    color:#a0aec0; font-size:11px; line-height:1.6;
    animation: fadeUp 0.6s 0.4s ease both;
  }

  /* Services pills */
  .pills {
    position:absolute; top:150px; left:16px; right:16px;
    display:flex; gap:5px; flex-wrap:wrap;
    animation: fadeUp 0.6s 0.55s ease both;
  }
  .pill {
    background:rgba(230,57,70,0.15); border:1px solid rgba(230,57,70,0.4);
    color:#ff6b7a; font-size:9px; font-weight:600; padding:3px 7px; border-radius:20px;
    letter-spacing:0.5px; text-transform:uppercase;
  }

  /* Phone */
  .phone-row {
    position:absolute; top:186px; left:16px; right:16px;
    display:flex; align-items:center; gap:6px;
    animation: fadeUp 0.6s 0.65s ease both;
  }
  .phone-icon { color:var(--primary); font-size:13px; }
  .phone-num { color:white; font-size:13px; font-weight:700; }

  /* CTA button */
  .cta {
    position:absolute; bottom:14px; left:16px; right:16px; height:36px;
    background: linear-gradient(135deg, #25d366, #1da851);
    border-radius:8px; display:flex; align-items:center; justify-content:center;
    gap:6px; text-decoration:none;
    animation: fadeUp 0.6s 0.75s ease both;
    box-shadow: 0 4px 15px rgba(37,211,102,0.35);
  }
  .cta:hover { filter:brightness(1.1); }
  .cta svg { width:14px; height:14px; fill:white; flex-shrink:0; }
  .cta-text { color:white; font-size:12px; font-weight:700; letter-spacing:0.5px; }

  /* Domain */
  .domain {
    position:absolute; bottom:56px; right:14px;
    color:#4a5568; font-size:9px; letter-spacing:0.5px;
    animation: fadeUp 0.6s 0.7s ease both;
  }

  @keyframes fadeUp   { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
  @keyframes fadeDown { from{opacity:0;transform:translateY(-8px)}  to{opacity:1;transform:none} }
</style>
</head>
