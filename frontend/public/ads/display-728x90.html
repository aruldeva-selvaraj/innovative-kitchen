<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:728px; height:90px; overflow:hidden; font-family:'Segoe UI',Arial,sans-serif; }

  .ad {
    width:728px; height:90px; overflow:hidden; cursor:pointer; position:relative;
    background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 60%, #1a1a2e 100%);
    display:flex; align-items:center;
    border-top:3px solid #E63946;
  }

  /* Shimmer accent */
  .ad::after {
    content:''; position:absolute; top:3px; left:0; right:0; height:1px;
    background:linear-gradient(90deg,transparent,rgba(230,57,70,0.4),transparent);
    animation: scan 2.5s linear infinite;
  }
  @keyframes scan { from{transform:translateX(-100%)} to{transform:translateX(100%)} }

  /* Logo / brand */
  .logo-section {
    width:160px; padding:0 16px; flex-shrink:0;
    border-right:1px solid rgba(255,255,255,0.1);
    animation: fadeIn 0.4s ease;
  }
  .brand-name { color:white; font-size:14px; font-weight:800; line-height:1.2; }
  .brand-sub  { color:#E63946; font-size:9px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; margin-top:2px; }

  /* Headline */
  .headline-section {
    flex:1; padding:0 20px;
    animation: fadeUp 0.5s 0.15s ease both;
  }
  .headline { color:white; font-size:18px; font-weight:800; white-space:nowrap; }
  .headline span { color:#E63946; }
  .tagline { color:#718096; font-size:10px; margin-top:2px; }

  /* Pills */
  .pills { display:flex; gap:5px; padding:0 10px; align-items:center; animation:fadeIn 0.5s 0.3s ease both; }
  .pill {
    background:rgba(230,57,70,0.12); border:1px solid rgba(230,57,70,0.35);
    color:#ff6b7a; font-size:9px; font-weight:700; padding:3px 8px; border-radius:20px;
    white-space:nowrap; text-transform:uppercase;
  }

  /* Contact */
  .contact-section {
    padding:0 14px; border-left:1px solid rgba(255,255,255,0.1); flex-shrink:0;
    animation: fadeIn 0.5s 0.25s ease both;
  }
  .phone { color:white; font-size:13px; font-weight:700; white-space:nowrap; }
  .email { color:#718096; font-size:9px; margin-top:2px; }

  /* CTA */
  .cta {
    margin:0 14px; padding:0 16px; height:44px; flex-shrink:0;
    background:linear-gradient(135deg,#25d366,#1da851);
    border-radius:8px; display:flex; align-items:center; gap:6px; text-decoration:none;
    animation: fadeIn 0.5s 0.4s ease both;
    box-shadow:0 2px 12px rgba(37,211,102,0.3);
  }
  .cta svg { width:13px; height:13px; fill:white; flex-shrink:0; }
  .cta-text { color:white; font-size:11px; font-weight:700; white-space:nowrap; }

  .domain {
    position:absolute; bottom:4px; right:6px;
    color:#2d3748; font-size:8px; letter-spacing:0.5px;
  }

  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
</style>
</head>
