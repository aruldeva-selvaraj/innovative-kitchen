<!DOCTYPE html>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:320px; height:50px; overflow:hidden; font-family:'Segoe UI',Arial,sans-serif; }

  .ad {
    width:320px; height:50px; cursor:pointer; position:relative; overflow:hidden;
    background:linear-gradient(135deg,#1a1a2e,#0f3460);
    display:flex; align-items:center;
    border-top:2px solid #E63946;
  }

  /* Animated side glow */
  .glow {
    position:absolute; left:0; top:0; bottom:0; width:3px;
    background:#E63946;
    box-shadow:0 0 8px #E63946;
    animation:pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Brand */
  .brand { padding:0 10px 0 10px; flex-shrink:0; animation:fadeIn 0.4s ease; }
  .brand-name { color:white; font-size:11px; font-weight:800; line-height:1.1; }
  .brand-sub  { color:#E63946; font-size:7px; font-weight:700; letter-spacing:1px; text-transform:uppercase; }

  /* Divider */
  .div { width:1px; height:30px; background:rgba(255,255,255,0.15); flex-shrink:0; }

  /* Text */
  .text-section { flex:1; padding:0 8px; animation:fadeUp 0.4s 0.1s ease both; }
  .main { color:white; font-size:11px; font-weight:700; white-space:nowrap; }
  .main span { color:#E63946; }
  .sub { color:#718096; font-size:8px; margin-top:1px; }

  /* Phone */
  .phone { color:#90cdf4; font-size:10px; font-weight:700; padding:0 8px; white-space:nowrap; animation:fadeIn 0.4s 0.2s ease both; }

  /* CTA */
  .cta {
    margin-right:8px; padding:0 10px; height:32px; flex-shrink:0;
    background:linear-gradient(135deg,#25d366,#1da851);
    border-radius:6px; display:flex; align-items:center; gap:4px; text-decoration:none;
    animation:fadeIn 0.4s 0.3s ease both;
    box-shadow:0 2px 8px rgba(37,211,102,0.3);
  }
  .cta svg { width:10px; height:10px; fill:white; }
  .cta-text { color:white; font-size:9px; font-weight:700; white-space:nowrap; }

  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
</style>
</head>
<body>
